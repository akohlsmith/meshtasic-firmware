version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.6.7
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - prettier@3.9.10
    - trufflehog@3.88.20
    - yamllint@1.38.0
    - bandit@1.9.4
    - checkov@3.3.29
    - terrascan@1.19.9
    - trivy@0.61.0
    - taplo@0.9.3
    - ruff@0.17.1
    - isort@9.0.2
    - markdownlint@0.44.0
    - oxipng@9.1.4
    - svgo@4.1.0
    - actionlint@1.7.7
    - flake8@7.4.1
    - hadolint@2.12.1-beta
    - shfmt@3.6.0
    - shellcheck@0.10.0
    - black@26.10.1
    - git-diff-check
    - gitleaks@8.24.2
    - clang-format@16.0.3
  ignore:
    - linters: [ALL]
      paths:
        - bin/**
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@18.20.5
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
